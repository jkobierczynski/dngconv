name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v5

      # libjxl is optional: without it everything but JPEG XL compression is
      # built and tested. On Linux it is required here, so that a break shows;
      # on the other two systems its absence is reported as a warning below.
      - name: Install LibRaw, zlib and libjxl (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libraw-dev zlib1g-dev libjxl-dev ninja-build

      # zlib comes with the macOS SDK.
      - name: Install LibRaw and libjxl (macOS)
        if: runner.os == 'macOS'
        run: brew install libraw jpeg-xl ninja

      - name: Install LibRaw, zlib and libjxl (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install libraw:x64-windows zlib:x64-windows libjxl:x64-windows

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDNGCONV_JXL=ON

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Report what was built
        shell: bash
        run: |
          exe=build/dngconv
          [ -f build/Release/dngconv.exe ] && exe=build/Release/dngconv.exe
          "$exe" --version
          if "$exe" --version | grep -q "JPEG XL: not in this build"; then
            echo "::warning::dngconv was built without JPEG XL on $RUNNER_OS: libjxl was not found or could not be linked (see the Configure step)"
          fi
